<!-- Método puro de HTML, podendo ser feito através do flexbox labs e extraindo o css do próprio figma -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- Blue Bar -->
    <div class="left">
      <div class="left-content">
        <img src="/src/public/images/Logo.png" alt="Logo" class="logo">

        <h1>GYM.IO</h1>
        <p>Gerencie seus treinos com eficiência</p>

        <ul>
          <li>Crie seções interativas</li>
          <li>Agende seus treinos</li>
          <li>Molde treinos personalizados</li>
        </ul>

      </div>
    </div>

    <!-- White Bar -->
    <div class="right">
      <div class="right-content">

        <h2>Bem-vindo de Volta !</h2>
        <p class="subtitle">Acesse sua conta para gerenciar seus treinos</p>

        <form>
          <input type="email" placeholder="Email">
          <input type="password" placeholder="Senha">

          <div class="options">
            <label>
              <input type="checkbox">
              Lembrar-me
            </label>

            <a href="#">Esqueceu a senha?</a>
          </div>

          <button>Entrar →</button>

          <p class="register">
            Não tem uma conta?
            <a href="cadastro.html">Criar uma</a>
          </p>
        </form>

      </div>
    </div>

  </div>

</body>
</html>
