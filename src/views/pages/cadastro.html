<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Cadastro</title>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

  <!-- Container Principal -->
  <div class="bg-white w-full max-w-6xl min-h-[80vh] mx-auto rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">

    <!-- LADO AZUL -->
    <div class="bg-[#1457F7] text-white flex flex-col p-6 md:p-10 md:w-1/2">

      <div class="w-full flex flex-col items-center justify-center text-center h-full">

        <!-- Logo -->
        <img src="/src/public/images/Cadastro.png"
             alt="Logo"
             class="w-40 md:w-72 mb-10">

        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
          COMECE AGORA !
        </h1>

        <p class="text-lg md:text-xl font-semibold mb-6">
          Inicie sua jornada de treinos conosco
        </p>

        <p class="text-base opacity-90">
          É prático, rápido e seguro
        </p>

      </div>
    </div>

    <!-- LADO BRANCO -->
    <div class="flex flex-col p-6 md:p-10 md:w-1/2">

      <div class="w-full max-w-md flex flex-col justify-center h-full mx-auto">

        <h2 class="text-2xl md:text-3xl font-bold mb-6 text-center">
          Cadastro
        </h2>

        <!-- FORM -->
        <form class="space-y-4">

          <!-- Nome -->
          <input type="text"
            placeholder="Seu nome completo"
            class="w-full border border-gray-300 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

          <!-- Email -->
          <input type="email"
            placeholder="seu@email.com"
            class="w-full border border-gray-300 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

          <!-- Senha -->
          <input type="password"
            placeholder="Mínimo 8 caracteres"
            class="w-full border border-gray-300 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

          <!-- Confirmar senha -->
          <input type="password"
            placeholder="Repita sua senha"
            class="w-full border border-gray-300 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

          <!-- Checkboxes -->
          <div class="space-y-3 text-sm">

            <label class="flex items-center gap-2">
              <input type="checkbox" class="h-4 w-4 text-blue-600">
              Concordo com os termos
            </label>

            <label class="flex items-center gap-2">
              <input type="checkbox" class="h-4 w-4 text-blue-600">
              Desejo receber emails promocionais
            </label>

          </div>

          <!-- Botão -->
          <button
            class="w-full bg-[#1457F7] text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition">
            Criar a conta
          </button>

          <!-- Link login -->
          <p class="text-sm text-center mt-4">
            Já possui uma conta?
            <a href="login.html" class="text-blue-600 hover:underline">
              Entrar
            </a>
          </p>

        </form>

      </div>
    </div>

  </div>

</body>
</html>
